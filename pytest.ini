[pytest]
testpaths = tests
python_files = test_*.py
norecursedirs = .git .claude __pycache__ wiki_vault output_reports project_files *.egg-info
pythonpath = .
addopts = --strict-markers -v
markers =
    golden: marks tests that validate against golden benchmark data
    xfail_new_engine: marks tests expected to fail until asteval engine is implemented
    xfail_calibration: marks tests expected to fail until calibration engine is implemented
